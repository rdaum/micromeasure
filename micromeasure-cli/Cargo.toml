[package]
name = "micromeasure-cli"
version = "0.11.1"
authors = ["Ryan Daum <ryan.daum@gmail.com>"]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/rdaum/micromeasure"
rust-version = "1.85.0"
description = "Provider-neutral report validation and comparison for micromeasure"
publish = false

[[bin]]
name = "micromeasure"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
micromeasure = { version = "0.11.1", path = ".." }
serde_json = "1.0"

[dev-dependencies]
serde = "1.0"
