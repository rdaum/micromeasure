[package]
name = "micromeasure-cli"
version = "0.16.0"
authors = ["Ryan Daum <ryan.daum@gmail.com>"]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/rdaum/micromeasure"
homepage = "https://github.com/rdaum/micromeasure"
readme = "README.md"
categories = ["development-tools::profiling", "development-tools::testing"]
keywords = ["benchmark", "microbenchmark", "comparison", "ci"]
rust-version = "1.95.0"
description = "Provider-neutral report validation and comparison for micromeasure"

[[bin]]
name = "micromeasure"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
micromeasure = { version = "0.16.0", path = ".." }
serde_json = "1.0"

[dev-dependencies]
serde = "1.0"
