[package]
name = "micromeasure"
version = "0.16.0"
authors = ["Ryan Daum <ryan.daum@gmail.com>"]
categories = ["development-tools::profiling", "development-tools::testing"]
edition = "2024"
keywords = ["benchmark", "microbenchmark", "perf", "pmu", "linux"]
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/rdaum/micromeasure"
homepage = "https://github.com/rdaum/micromeasure"
documentation = "https://docs.rs/micromeasure"
rust-version = "1.95.0"
description = "Microbenchmark harness for tiny operations and PMU-aware measurement"
exclude = ["BUILDKITE-CI-DESIGN.md"]

[workspace]
members = [".", "micromeasure-cli"]
default-members = [".", "micromeasure-cli"]
resolver = "3"

# This is a dev-only crate - only used in benchmarks and tests
[lib]
doctest = false

[dependencies]
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
unicode-width = "0.2"
pollster = { version = "0.4", optional = true }
wgpu = { version = "30.0", default-features = false, features = ["dx12", "gles", "metal", "std", "vulkan", "wgsl"], optional = true }

[features]
default = []
cuda = []
gpu-counters = ["cuda"]
wgpu-example = ["dep:pollster", "dep:wgpu"]

[target.'cfg(all(target_os = "linux"))'.dependencies]
perf-event2 = "0.7"

[[example]]
name = "cuda_event_backend"
required-features = ["cuda"]

[[example]]
name = "gpu_counters"
required-features = ["gpu-counters"]

[[example]]
name = "wgpu_timestamp_backend"
required-features = ["wgpu-example"]

[[test]]
name = "wgpu_timestamp_conversion"
required-features = ["wgpu-example"]
